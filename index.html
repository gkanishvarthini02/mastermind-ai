<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>MasterMind AI - UPSC & TNPSC Video Engine</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { margin: 0; padding: 20px; background-color: #020617; color: #f8fafc; }
    .container { max-width: 600px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #1e293b; padding-bottom: 16px; margin-bottom: 24px; }
    .title { font-size: 22px; font-weight: bold; color: #60a5fa; margin: 0; }
    .subtitle { font-size: 12px; color: #94a3b8; margin: 0; }
    .badge { background: #0f172a; border: 1px solid #334155; padding: 6px 12px; border-radius: 9999px; font-size: 13px; }
    .card { background: #0f172a; border: 1px solid #1e293b; padding: 20px; border-radius: 16px; margin-bottom: 20px; }
    label { font-size: 12px; color: #94a3b8; font-weight: bold; display: block; margin-bottom: 8px; }
    .btn-group { display: flex; gap: 10px; margin-bottom: 16px; }
    .btn-toggle { flex: 1; padding: 10px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; cursor: pointer; font-weight: bold; }
    .btn-toggle.active { background: #2563eb; border-color: #3b82f6; }
    textarea { width: 100%; padding: 12px; background: #1e293b; border: 1px solid #334155; border-radius: 8px; color: white; font-size: 14px; margin-bottom: 16px; resize: none; }
    .btn-generate { width: 100%; padding: 12px; background: linear-gradient(135deg, #2563eb, #4f46e5); border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 15px; cursor: pointer; }
    .reel-box { display: none; background: #0f172a; border: 1px solid #334155; border-radius: 16px; padding: 20px; text-align: center; margin-top: 20px; }
    .video-preview { max-width: 220px; height: 350px; background: #1e293b; margin: 12px auto; border-radius: 12px; border: 1px solid #475569; display: flex; flex-direction: column; justify-content: space-between; padding: 16px; }
    .download-btn { width: 100%; padding: 12px; background: #059669; border: none; border-radius: 8px; color: white; font-weight: bold; cursor: pointer; margin-top: 10px; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <div>
        <h1 class="title">MasterMind AI</h1>
        <p class="subtitle">UPSC & TNPSC Short Video Engine</p>
      </div>
      <div class="badge">Credits: <strong style="color: #fbbf24;" id="credits">20</strong></div>
    </header>

    <div class="card">
      <label>TARGET EXAM</label>
      <div class="btn-group">
        <button class="btn-toggle active" id="btn-tnpsc" onclick="setExam('TNPSC')">TNPSC</button>
        <button class="btn-toggle" id="btn-upsc" onclick="setExam('UPSC')">UPSC</button>
      </div>

      <label>TOPIC OR QUESTION</label>
      <textarea id="topicInput" rows="3" placeholder="e.g. Indus Valley Civilization, Stone Age in India, River Systems..."></textarea>

      <button class="btn-generate" id="genBtn" onclick="generateReel()">✨ Generate MCQ Reel (1 Credit)</button>
    </div>

    <div class="reel-box" id="reelResult">
      <h3 style="color: #34d399; margin: 0 0 10px 0; font-size: 15px;">✅ Video Reel Ready!</h3>
      <div class="video-preview">
        <span style="font-size: 11px; background: #2563eb; padding: 3px 8px; border-radius: 4px; align-self: center;" id="previewCategory">TNPSC QUIZ</span>
        <p style="font-size: 13px; margin: 0;" id="previewTopic"></p>
        <span style="font-size: 11px; color: #94a3b8;">Timer: 5s ⏳ | Audio Synced</span>
      </div>
      <button class="download-btn" onclick="alert('Downloading your MasterMind AI MP4 Reel...')">📥 Download MP4 Reel</button>
    </div>
  </div>

  <script>
    let currentExam = "TNPSC";
    let creditCount = 20;

    function setExam(exam) {
      currentExam = exam;
      document.getElementById('btn-tnpsc').className = exam === 'TNPSC' ? 'btn-toggle active' : 'btn-toggle';
      document.getElementById('btn-upsc').className = exam === 'UPSC' ? 'btn-toggle active' : 'btn-toggle';
    }

    function generateReel() {
      const topic = document.getElementById('topicInput').value.trim();
      if (!topic) return alert("Please enter an exam topic!");

      const btn = document.getElementById('genBtn');
      btn.innerText = "Synthesizing Video...";
      btn.disabled = true;

      setTimeout(() => {
        btn.innerText = "✨ Generate MCQ Reel (1 Credit)";
        btn.disabled = false;
        creditCount = Math.max(0, creditCount - 1);
        document.getElementById('credits').innerText = creditCount;
        
        document.getElementById('previewCategory').innerText = currentExam + " QUIZ";
        document.getElementById('previewTopic').innerText = topic;
        document.getElementById('reelResult').style.display = 'block';
      }, 1500);
    }
  </script>
</body>
</html>
