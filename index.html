<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MasterMind AI — School Studies</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:#f5f7fb;color:#111827}.head{background:#111827;color:white;padding:18px 16px}.head h1{margin:0;font-size:22px}.head p{margin:5px 0 0;color:#cbd5e1;font-size:13px}.wrap{max-width:720px;margin:auto;padding:16px}.card{background:white;border:1px solid #e5e7eb;border-radius:16px;padding:16px;margin-bottom:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}button{border:0;border-radius:12px;padding:13px;font-weight:700;background:#eef2ff;color:#1e3a8a;cursor:pointer}.primary{background:#2563eb;color:white}.back{background:#e5e7eb;color:#111827;margin-bottom:12px}.hidden{display:none!important}.sub{color:#64748b;font-size:13px}.chat{height:52vh;overflow:auto;background:#f8fafc;border-radius:14px;padding:12px;margin:12px 0}.msg{padding:10px 12px;border-radius:13px;margin:8px 0;max-width:90%;white-space:pre-wrap;line-height:1.45}.user{background:#2563eb;color:white;margin-left:auto}.ai{background:white;border:1px solid #e2e8f0}.compose{display:flex;gap:8px}.compose input{flex:1;padding:13px;border:1px solid #cbd5e1;border-radius:12px}.subject{text-align:left;background:#f8fafc;border:1px solid #e2e8f0}.quiz{background:white;border:1px solid #e2e8f0;border-radius:14px;padding:15px;margin-top:12px;white-space:pre-wrap;line-height:1.5}
</style></head><body>
<header class="head"><h1>🎓 MasterMind AI — School Studies</h1><p>Board → Standard → Subject → Direct AI Chat</p></header><main class="wrap">
<section id="boards" class="card"><h2>Choose School Board</h2><p class="sub">Select curriculum</p><div class="grid"><button onclick="board('Samacheer Kalvi')">📘 Samacheer Kalvi</button><button onclick="board('CBSE')">📗 CBSE</button><button onclick="board('ICSE')">📙 ICSE</button></div></section>
<section id="standards" class="card hidden"><button class="back" onclick="show('boards')">← Back</button><h2 id="bt"></h2><p class="sub">Choose Standard</p><div id="sg" class="grid"></div></section>
<section id="subjects" class="card hidden"><button class="back" onclick="show('standards')">← Back</button><h2 id="st"></h2><p class="sub">Choose Subject</p><div id="subg" class="grid"></div></section>
<section id="study" class="card hidden"><button class="back" onclick="show('subjects')">← Back</button><h2 id="title"></h2><div class="grid"><button onclick="quiz()">🗳️ Complete Lesson Quiz</button><button onclick="ask('Create complete study notes for this subject.')">📚 Notes</button><button onclick="ask('Create a finished PDF-ready study document for my exact request.')">📄 PDF</button><button onclick="ask('Create a finished PowerPoint presentation for my exact request.')">📊 PPT</button><button onclick="ask('Create a finished Word document for my exact request.')">📝 Word</button><button onclick="ask('Create a finished Excel worksheet for my exact request.')">📈 Excel</button><button onclick="ask('Create HD educational diagrams or images for my exact request.')">🖼️ HD Image</button><button onclick="ask('Create a complete worksheet for my exact request.')">📋 Worksheet</button></div><div id="chat" class="chat"></div><div class="compose"><input id="inp" placeholder="Ask anything..." onkeydown="if(event.key==='Enter')send()"><button class="primary" onclick="send()">Send</button></div></section>
<section id="quizsec" class="card hidden"><button class="back" onclick="show('study')">← Back</button><h2>🗳️ Complete Lesson Quiz</h2><p class="sub">Give lesson/topic. AI will cover the supplied content comprehensively.</p><div class="compose"><input id="qt" placeholder="Example: Water Cycle — Lesson 3"><button class="primary" onclick="makeQuiz()">Start</button></div><div id="qa"></div></section>
</main><script>
let B='',S='',SUB='';
const subjects={low:['Tamil','English','Mathematics','Science','Social Science'],mid:['Tamil','English','Mathematics','Science','Social Science'],high:['Tamil','English','Mathematics','Physics','Chemistry','Biology','Computer Science','History','Geography','Literature']};
function show(x){['boards','standards','subjects','study','quizsec'].forEach(id=>document.getElementById(id).classList.add('hidden'));document.getElementById(x).classList.remove('hidden');scrollTo(0,0)}
function board(x){B=x;document.getElementById('bt').textContent='📘 '+x;let g=document.getElementById('sg');g.innerHTML='';for(let i=1;i<=12;i++){let b=document.createElement('button');b.textContent=i+(i==1?'st':i==2?'nd':i==3?'rd':'th')+' Standard';b.onclick=()=>standard(i);g.appendChild(b)}show('standards')}
function standard(x){S=x;document.getElementById('st').textContent=B+' — '+x+' Standard';let list=subjects[x<=5?'low':x<=10?'mid':'high'],g=document.getElementById('subg');g.innerHTML='';list.forEach(v=>{let b=document.createElement('button');b.className='subject';b.textContent=v;b.onclick=()=>subject(v);g.appendChild(b)});show('subjects')}
function subject(x){SUB=x;document.getElementById('title').textContent=B+' • '+S+' Standard • '+x;document.getElementById('chat').innerHTML='';show('study');ai('Ready! Ask anything about '+x+'.')}
function msg(t,x){let d=document.createElement('div');d.className='msg '+t;d.textContent=x;let c=document.getElementById('chat');c.appendChild(d);c.scrollTop=c.scrollHeight}
async function call(prompt){msg('user',prompt);msg('ai','MasterMind AI is thinking...');let c=document.getElementById('chat'),loader=c.lastChild;try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`SCHOOL STUDIES CONTEXT\nBoard: ${B}\nStandard: ${S}\nSubject: ${SUB}\n\nUSER REQUEST:\n${prompt}`})});let d=await r.json();if(!r.ok)throw Error(d.error||'AI request failed');loader.textContent=d.text||'No result.'}catch(e){loader.textContent='AI Connection Error: '+e.message}}
function ai(x){msg('ai',x)}function send(){let i=document.getElementById('inp'),v=i.value.trim();if(v){i.value='';call(v)}}function ask(x){let d=prompt('What exactly should I create? Include lesson/topic and details.');if(d)call(x+' Details: '+d)}
function quiz(){show('quizsec');document.getElementById('qt').focus()}
async function makeQuiz(){let t=document.getElementById('qt').value.trim();if(!t)return;let a=document.getElementById('qa');a.innerHTML='<div class="quiz">Generating complete lesson quiz...</div>';try{let r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:`Create a comprehensive quiz from the supplied lesson/topic. Board: ${B}; Standard: ${S}; Subject: ${SUB}; Topic: ${t}. Cover all supplied lesson content. Include MCQ, true/false, fill blanks, matching, one-word, short answers and important exam questions where appropriate. Give answer key and explanations. Do not invent textbook-specific facts not supplied.`})});let d=await r.json();if(!r.ok)throw Error(d.error||'Quiz failed');a.firstChild.textContent=d.text||'No quiz generated.'}catch(e){a.firstChild.textContent='Quiz Error: '+e.message}}
</script></body></html>
