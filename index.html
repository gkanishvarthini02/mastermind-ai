<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MasterMind AI</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Google Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; width: 100%; background-color: #ffffff; color: #1f1f1f; overflow: hidden; }

    .app-root { display: flex; flex-direction: column; height: 100vh; height: 100dvh; width: 100%; background: #ffffff; }

    /* Top Gemini Bar */
    .top-bar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; border-bottom: 1px solid #f0f4f9; flex-shrink: 0; background: #ffffff; }
    .icon-btn { background: none; border: none; font-size: 20px; color: #444746; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
    .icon-btn:active { background: #f0f4f9; }
    .brand-title { font-size: 19px; font-weight: 600; display: flex; align-items: center; gap: 6px; background: linear-gradient(90deg, #1a73e8, #9333ea); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }

    /* Drawer Sidebar */
    .drawer-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.3); z-index: 50; display: none; }
    .drawer-overlay.active { display: block; }
    .drawer { position: fixed; top: 0; left: -290px; width: 280px; height: 100%; background: #f0f4f9; border-right: 1px solid #e3e3e3; z-index: 60; transition: transform 0.25s ease; display: flex; flex-direction: column; }
    .drawer.active { transform: translateX(290px); }
    .drawer-head { padding: 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 600; color: #1f1f1f; font-size: 16px; }
    .btn-new { margin: 8px 16px 14px; padding: 12px 16px; background: #dde3ea; color: #1f1f1f; border: none; border-radius: 24px; font-weight: 600; font-size: 14px; cursor: pointer; }
    .drawer-label { font-size: 11px; font-weight: 700; color: #5e5e5e; padding: 10px 16px 4px; text-transform: uppercase; }
    .drawer-select { width: calc(100% - 32px); margin: 0 16px 12px; padding: 10px 12px; border: 1px solid #c7c7c7; border-radius: 10px; font-size: 13.5px; background: #ffffff; }
    .history-list { flex: 1; overflow-y: auto; padding: 0 8px; list-style: none; }
    .history-item { padding: 10px 14px; font-size: 13px; color: #444746; cursor: pointer; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 16px; margin-bottom: 2px; }
    .history-item:active { background: #e0e5eb; }

    /* Chat Stream View */
    .chat-scroll { flex: 1; overflow-y: auto; padding: 16px 16px 8px; display: flex; flex-direction: column; gap: 16px; max-width: 760px; margin: 0 auto; width: 100%; }
    
    .welcome-card { padding: 24px 8px 12px; text-align: left; }
    .welcome-greet { font-size: 28px; font-weight: 600; background: linear-gradient(90deg, #1a73e8, #d946ef); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 4px; }
    .welcome-sub { font-size: 24px; font-weight: 500; color: #c4c7c5; }
    
    .quick-chips { display: flex; gap: 8px; overflow-x: auto; padding: 14px 0 6px; scrollbar-width: none; }
    .quick-chips::-webkit-scrollbar { display: none; }
    .chip { flex-shrink: 0; background: #f0f4f9; border: 1px solid #e3e3e3; padding: 10px 14px; border-radius: 16px; font-size: 13px; color: #1f1f1f; font-weight: 500; cursor: pointer; }
    
    /* Message Bubbles */
    .msg-group { display: flex; gap: 10px; width: 100%; }
    .msg-group.user { justify-content: flex-end; }
    .bubble { max-width: 86%; padding: 12px 18px; border-radius: 20px; font-size: 15px; line-height: 1.6; word-wrap: break-word; }
    .bubble.user { background: #e9eef6; color: #1f1f1f; border-bottom-right-radius: 4px; }
    .bubble.ai { background: transparent; color: #1f1f1f; padding: 4px 0; width: 100%; max-width: 100%; }

    .ai-row { display: flex; gap: 12px; width: 100%; align-items: flex-start; }
    .ai-sparkle { width: 28px; height: 28px; border-radius: 50%; background: linear-gradient(135deg, #1a73e8, #9333ea); display: flex; align-items: center; justify-content: center; color: white; font-size: 14px; flex-shrink: 0; margin-top: 2px; }

    /* In-Chat Video Reel Output Card */
    .video-card { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 20px; padding: 16px; margin-top: 12px; text-align: center; }
    .video-status { font-size: 13px; color: #d97706; font-weight: bold; margin-bottom: 8px; }
    canvas { width: 100%; max-width: 270px; aspect-ratio: 9/16; background: #000; border-radius: 16px; border: 2px solid #1a73e8; display: block; margin: 10px auto; box-shadow: 0 4px 20px rgba(0,0,0,0.15); }
    .btn-download-video { width: 100%; max-width: 270px; margin: 10px auto 0; padding: 14px; background: #059669; color: white; border: none; border-radius: 24px; font-weight: bold; font-size: 14px; cursor: pointer; display: none; }

    /* Floating Input Capsule */
    .input-wrapper { padding: 8px 16px 16px; background: #ffffff; flex-shrink: 0; max-width: 760px; margin: 0 auto; width: 100%; }
    .input-capsule { display: flex; align-items: center; background: #f0f4f9; border-radius: 28px; padding: 6px 8px 6px 16px; gap: 8px; border: 1px solid transparent; }
    .input-capsule:focus-within { background: #ffffff; border-color: #c7c7c7; box-shadow: 0 1px 6px rgba(0,0,0,0.1); }
    .text-input { flex: 1; border: none; background: transparent; font-size: 15px; outline: none; color: #1f1f1f; padding: 8px 0; }
    .btn-circle { width: 40px; height: 40px; border-radius: 50%; border: none; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 17px; flex-shrink: 0; }
    .btn-mic { background: transparent; color: #444746; }
    .btn-mic.rec { background: #fce8e6; color: #d93025; animation: pulse 1s infinite; }
    .btn-send { background: #1a73e8; color: #ffffff; }

    @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
  </style>
</head>
<body>

  <div class="app-root">

    <!-- Top Bar -->
    <div class="top-bar">
      <button class="icon-btn" onclick="toggleDrawer()">☰</button>
      <div class="brand-title">✦ MasterMind AI</div>
      <button class="icon-btn" onclick="startNewChat()">＋</button>
    </div>

    <!-- Drawer -->
    <div class="drawer-overlay" id="overlay" onclick="toggleDrawer()"></div>
    <div class="drawer" id="drawer">
      <div class="drawer-head">
        <div>✦ MasterMind</div>
        <button class="icon-btn" onclick="toggleDrawer()">✕</button>
      </div>

      <button class="btn-new" onclick="startNewChat()">＋ New Chat</button>

      <div class="drawer-label">Language / மொழி</div>
      <select class="drawer-select" id="appLang" onchange="onLanguageChange()">
        <option value="ta-IN">தமிழ் (Tamil)</option>
        <option value="en-IN">English (India)</option>
        <option value="hi-IN">हिन्दी (Hindi)</option>
        <option value="te-IN">తెలుగు (Telugu)</option>
      </select>

      <div class="drawer-label">Recent Chats</div>
      <ul class="history-list" id="historyList"></ul>
    </div>

    <!-- Direct Chat Stream View -->
    <div class="chat-scroll" id="chatStream">
      <div class="welcome-card" id="welcomeCard">
        <div class="welcome-greet">Hello, Learner</div>
        <div class="welcome-sub">How can I help you today?</div>
        
        <div class="quick-chips">
          <div class="chip" onclick="quickPrompt('Daily current affairs latest GK 5 questions video ready pannu')">🌍 Current Affairs & GK Reel</div>
          <div class="chip" onclick="quickPrompt('6th standard tamil 1st lesson 5 questions quiz video ready pannu')">🎬 6th Tamil 1st Lesson Video</div>
          <div class="chip" onclick="quickPrompt('8th standard science lesson 4 matter around us 5 questions video ready pannu')">🔬 8th Science Matter Video</div>
          <div class="chip" onclick="quickPrompt('TNPSC Unit 8 thirukkural 5 questions quiz video ready pannu')">🏛️ TNPSC Unit 8 Video Reel</div>
        </div>
      </div>
    </div>

    <!-- Floating Input Capsule -->
    <div class="input-wrapper">
      <div class="input-capsule">
        <input type="text" class="text-input" id="chatInput" placeholder="Ask anything (e.g. Current affairs video / 8th science quiz)..." onkeypress="if(event.key==='Enter') sendMessage()" />
        <button class="btn-circle btn-mic" id="micBtn" onclick="startVoice()">🎤</button>
        <button class="btn-circle btn-send" onclick="sendMessage()">➤</button>
      </div>
    </div>

  </div>

  <script>
    let currentLang = 'ta-IN';
    let chatHistory = JSON.parse(localStorage.getItem('mm_history') || '[]');
    let currentSessionMessages = [];
    let audioCtx = null;

    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
    }

    function playTickSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(800, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.05);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.05);
      } catch (e) {}
    }

    function playSuccessSound() {
      try {
        initAudio();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.frequency.setValueAtTime(587.33, audioCtx.currentTime);
        osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.1);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.4);
      } catch (e) {}
    }

    function toggleDrawer() {
      document.getElementById('drawer').classList.toggle('active');
      document.getElementById('overlay').classList.toggle('active');
    }

    function startNewChat() {
      currentSessionMessages = [];
      document.getElementById('chatStream').innerHTML = `
        <div class="welcome-card" id="welcomeCard">
          <div class="welcome-greet">Hello, Learner</div>
          <div class="welcome-sub">How can I help you today?</div>
          <div class="quick-chips">
            <div class="chip" onclick="quickPrompt('Daily current affairs latest GK 5 questions video ready pannu')">🌍 Current Affairs & GK Reel</div>
            <div class="chip" onclick="quickPrompt('6th standard tamil 1st lesson 5 questions quiz video ready pannu')">🎬 6th Tamil 1st Lesson Video</div>
            <div class="chip" onclick="quickPrompt('8th standard science lesson 4 matter around us 5 questions video ready pannu')">🔬 8th Science Matter Video</div>
            <div class="chip" onclick="quickPrompt('TNPSC Unit 8 thirukkural 5 questions quiz video ready pannu')">🏛️ TNPSC Unit 8 Video Reel</div>
          </div>
        </div>
      `;
      if (document.getElementById('drawer').classList.contains('active')) toggleDrawer();
    }

    function quickPrompt(text) {
      document.getElementById('chatInput').value = text;
      sendMessage();
    }

    function addMessage(sender, text) {
      const welcomeCard = document.getElementById('welcomeCard');
      if (welcomeCard) welcomeCard.style.display = 'none';

      const chatStream = document.getElementById('chatStream');

      if (sender === 'user') {
        const row = document.createElement('div');
        row.className = 'msg-group user';
        row.innerHTML = `<div class="bubble user">${text.replace(/\n/g, '<br/>')}</div>`;
        chatStream.appendChild(row);
      } else {
        const row = document.createElement('div');
        row.className = 'ai-row';
        row.innerHTML = `
          <div class="ai-sparkle">✦</div>
          <div class="bubble ai">${text.replace(/\n/g, '<br/>')}</div>
        `;
        chatStream.appendChild(row);
      }

      chatStream.scrollTop = chatStream.scrollHeight;
      currentSessionMessages.push({ sender, text });
      saveSessionToHistory();
    }

    function saveSessionToHistory() {
      if (currentSessionMessages.length > 1) {
        const firstUser = currentSessionMessages.find(m => m.sender === 'user');
        if (firstUser) {
          const title = firstUser.text.substring(0, 26);
          if (!chatHistory.find(h => h.title === title)) {
            chatHistory.unshift({ title, messages: currentSessionMessages });
            if (chatHistory.length > 15) chatHistory.pop();
            localStorage.setItem('mm_history', JSON.stringify(chatHistory));
            renderHistoryList();
          }
        }
      }
    }

    function renderHistoryList() {
      const list = document.getElementById('historyList');
      list.innerHTML = '';
      chatHistory.forEach((item) => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerText = `✦ ${item.title}`;
        li.onclick = () => {
          document.getElementById('chatStream').innerHTML = '';
          item.messages.forEach(m => addMessage(m.sender, m.text));
          if (document.getElementById('drawer').classList.contains('active')) toggleDrawer();
        };
        list.appendChild(li);
      });
    }

    function startVoice() {
      if (!('webkitSpeechRecognition' in window || 'SpeechRecognition' in window)) {
        alert("Voice recognition not supported. Please type!");
        return;
      }
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      const rec = new SpeechRec();
      rec.lang = currentLang;

      const mic = document.getElementById('micBtn');
      mic.classList.add('rec');

      rec.onresult = (e) => {
        mic.classList.remove('rec');
        document.getElementById('chatInput').value = e.results[0][0].transcript;
        sendMessage();
      };
      rec.onerror = () => mic.classList.remove('rec');
      rec.onend = () => mic.classList.remove('rec');
      rec.start();
    }

    function getDynamicQuestionsForPrompt(prompt) {
      const p = prompt.toLowerCase();
      if (p.includes("current") || p.includes("affair") || p.includes("gk") || p.includes("general") || p.includes("நடப்பு")) {
        return { bank: masterKnowledgeBank.currentAffairs, title: "DAILY CURRENT AFFAIRS & GK" };
      }
      if (p.includes("tamil") || p.includes("6th") || p.includes("தமிழ்")) {
        return { bank: masterKnowledgeBank.tamil6th, title: "6th STANDARD TAMIL • LESSON 1" };
      }
      if (p.includes("science") || p.includes("matter") || p.includes("அறிவியல்") || p.includes("8th")) {
        return { bank: masterKnowledgeBank.science8th, title: "8th SCIENCE • MATTER AROUND US" };
      }
      if (p.includes("tnpsc") || p.includes("unit 8") || p.includes("upsc") || p.includes("history")) {
        return { bank: masterKnowledgeBank.tnpscUnit8, title: "TNPSC UNIT-8 SPECIAL QUIZ" };
      }
      
      // Default generated custom high-yield questions
      return {
        title: prompt.substring(0, 30).toUpperCase(),
        bank: [
          {
            tag: "EXAM QUESTION • 1",
            q: `1. ${prompt} - முதன்மை முக்கிய தேர்வு வினா மற்றும் அடிப்படைக் கோட்பாடு என்ன?`,
            opts: ["A) நேரடி விடை மற்றும் விதி", "B) பயன்பாட்டுக் கோட்பாடு", "C) வரலாற்றுப் பின்னணி", "D) ஒப்பீட்டு ஆய்வு"],
            ans: 0
          },
          {
            tag: "EXAM QUESTION • 2",
            q: `2. ${prompt} தொடர்பாக தேர்வுகளில் கேட்கப்படும் முக்கிய ஆண்டு அல்லது வரையறை எது?`,
            opts: ["A) முதல்நிலைத் தத்துவம்", "B) இரண்டாம் நிலை தத்துவம்", "C) சரியான வரையறை விடை", "D) மேற்கண்ட அனைத்தும்"],
            ans: 2
          },
          {
            tag: "EXAM QUESTION • 3",
            q: `3. ${prompt} பாடத்தில் அதிக மதிப்பெண் பெறும் முக்கிய பகுதி எது?`,
            opts: ["A) அட்டவணை மற்றும் சூத்திரங்கள்", "B) பொதுவான பகுதிகள்", "C) முந்தைய ஆண்டு வினாக்கள்", "D) அனைத்தும்"],
            ans: 3
          },
          {
            tag: "EXAM QUESTION • 4",
            q: `4. ${prompt} சார்ந்த தமிழ்நாடு பாடநூல் மற்றும் போட்டித் தேர்வு முக்கிய வினா எது?`,
            opts: ["A) கூற்று 1 மற்றும் 2 சரி", "B) கூற்று 1 மட்டும் சரி", "C) கூற்று 2 மட்டும் சரி", "D) இரண்டும் தவறு"],
            ans: 0
          },
          {
            tag: "EXAM QUESTION • 5",
            q: `5. ${prompt} பற்றிய சரியான தேர்வு மதிப்பீடு முடிவு எது?`,
            opts: ["A) முதன்மை முடிவு A", "B) இரண்டாம் நிலை முடிவு B", "C) பயன்பாட்டு விடை C", "D) இறுதி மதிப்பீடு D"],
            ans: 0
          }
        ]
      };
    }

    function sendMessage() {
      const input = document.getElementById('chatInput');
      const prompt = input.value.trim();
      if (!prompt) return;

      addMessage('user', prompt);
      input.value = '';

      const { bank, title } = getDynamicQuestionsForPrompt(prompt);

      const reply = `🎬 நிச்சயமாக! நீங்கள் கேட்ட **${title}**-க்கான **5 கேள்விகள் கொண்ட Full HD YouTube Shorts வீடியோ (5s Countdown Timer, Ticking Sound & MP4 Download உடன்)** நேரடியாக இதோ உருவாக்கப்படுகிறது:`;
      addMessage('ai', reply);
      renderDirectVideoReel(bank, title);
    }

    function renderDirectVideoReel(questions, titleText) {
      const chatStream = document.getElementById('chatStream');

      const card = document.createElement('div');
      card.className = 'video-card';
      const videoId = 'canvas_' + Date.now();
      const dlBtnId = 'dl_' + Date.now();
      const statusId = 'status_' + Date.now();

      card.innerHTML = `
        <div class="video-status" id="${statusId}">🔴 Rendering 5-Question Video Reel with Timer (40s)...</div>
        <canvas id="${videoId}" width="720" height="1280"></canvas>
        <button class="btn-download-video" id="${dlBtnId}">📥 Download YouTube Shorts Video (MP4)</button>
      `;

      chatStream.appendChild(card);
      chatStream.scrollTop = chatStream.scrollHeight;

      const canvas = document.getElementById(videoId);
      const ctx = canvas.getContext('2d');
      const dlBtn = document.getElementById(dlBtnId);
      const statusText = document.getElementById(statusId);

      let recordedBlobs = [];
      const stream = canvas.captureStream(60);
      let selectedMime = ['video/mp4', 'video/webm;codecs=vp9', 'video/webm'].find(type => MediaRecorder.isTypeSupported(type)) || 'video/webm';

      const mediaRecorder = new MediaRecorder(stream, { mimeType: selectedMime });
      mediaRecorder.ondataavailable = (e) => { if (e.data.size > 0) recordedBlobs.push(e.data); };
      
      let finalVideoUrl = null;
      mediaRecorder.onstop = () => {
        const superBlob = new Blob(recordedBlobs, { type: selectedMime });
        finalVideoUrl = URL.createObjectURL(superBlob);
        statusText.innerText = "✅ Video Ready! Download for YouTube Shorts / Reels:";
        statusText.style.color = "#059669";
        dlBtn.style.display = "block";
        dlBtn.onclick = () => {
          const a = document.createElement("a");
          a.href = finalVideoUrl;
          a.download = `${titleText.replace(/[^a-zA-Z0-9]/g, '_')}_Reel.mp4`;
          a.click();
        };
      };

      mediaRecorder.start();

      const qDuration = 8000;
      const totalDuration = qDuration * questions.length;
      const startTime = Date.now();
      let lastBeepSec = -1;

      function draw() {
        const elapsed = Date.now() - startTime;
        const currentQIndex = Math.min(Math.floor(elapsed / qDuration), questions.length - 1);
        const qElapsed = elapsed % qDuration;
        const currentQ = questions[currentQIndex];

        const timerSeconds = Math.max(0, Math.ceil(5 - (qElapsed / 1000)));
        const showAnswer = qElapsed > 5000;

        if (timerSeconds > 0 && timerSeconds !== lastBeepSec && qElapsed < 5000) {
          playTickSound();
          lastBeepSec = timerSeconds;
        }
        if (showAnswer && lastBeepSec !== 0) {
          playSuccessSound();
          lastBeepSec = 0;
        }

        ctx.fillStyle = "#020617";
        ctx.fillRect(0, 0, 720, 1280);

        ctx.fillStyle = "#2563eb";
        ctx.beginPath();
        ctx.roundRect(100, 70, 520, 56, 28);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 21px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(`${titleText} • Q ${currentQIndex + 1}/${questions.length}`, 360, 106);

        ctx.strokeStyle = showAnswer ? "#10b981" : "#fbbf24";
        ctx.lineWidth = 8;
        ctx.beginPath();
        ctx.arc(360, 200, 48, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = "#ffffff";
        ctx.font = "bold 32px sans-serif";
        ctx.fillText(showAnswer ? "✓" : timerSeconds + "s", 360, 212);

        ctx.fillStyle = "#0f172a";
        ctx.strokeStyle = "#1e3a8a";
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.roundRect(40, 280, 640, 280, 20);
        ctx.fill();
        ctx.stroke();

        ctx.fillStyle = "#60a5fa";
        ctx.font = "bold 18px sans-serif";
        ctx.fillText("• " + currentQ.tag + " •", 360, 325);

        ctx.fillStyle = "#f8fafc";
        ctx.font = "bold 26px sans-serif";
        wrapText(ctx, currentQ.q, 360, 380, 580, 38);

        const optY = [590, 705, 820, 935];
        currentQ.opts.forEach((opt, idx) => {
          const isCorrect = idx === currentQ.ans;
          const highlight = showAnswer && isCorrect;

          ctx.fillStyle = highlight ? "#064e3b" : "#0f172a";
          ctx.strokeStyle = highlight ? "#10b981" : "#334155";
          ctx.lineWidth = highlight ? 4 : 2;

          ctx.beginPath();
          ctx.roundRect(40, optY[idx], 640, 88, 14);
          ctx.fill();
          ctx.stroke();

          ctx.fillStyle = highlight ? "#34d399" : "#f1f5f9";
          ctx.font = "bold 22px sans-serif";
          ctx.textAlign = "left";
          ctx.fillText(opt + (highlight ? "  ✓" : ""), 70, optY[idx] + 54);
        });

        ctx.fillStyle = "#64748b";
        ctx.font = "20px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("⚡ MasterMind AI • YouTube Shorts Studio", 360, 1180);

        if (elapsed < totalDuration) {
          requestAnimationFrame(draw);
        } else {
          mediaRecorder.stop();
        }
      }

      draw();
    }

    function wrapText(ctx, text, x, y, maxWidth, lineHeight) {
      const words = text.split(' ');
      let line = '';
      let testY = y;
      for (let n = 0; n < words.length; n++) {
        const testLine = line + words[n] + ' ';
        if (ctx.measureText(testLine).width > maxWidth && n > 0) {
          ctx.fillText(line, x, testY);
          line = words[n] + ' ';
          testY += lineHeight;
        } else {
          line = testLine;
        }
      }
      ctx.fillText(line, x, testY);
    }

    window.onload = () => {
      currentLang = document.getElementById('appLang').value;
      renderHistoryList();
    };
  </script>
