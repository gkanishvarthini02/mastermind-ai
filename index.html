<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MasterMind AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --border: #e2e8f0;
      --primary: #1a73e8;
      --primary-gradient: linear-gradient(135deg, #1a73e8, #7c3aed);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bubble-user: #e0e7ff;
      --bubble-user-text: #1e1b4b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      background: #ffffff;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    .header {
      height: 58px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
      z-index: 30;
      flex-shrink: 0;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #334155;
      cursor: pointer;
    }

    .btn-icon:active { background: #f1f5f9; }

    .app-title {
      font-size: 19px;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    /* Side Drawer */
    .drawer {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background: #ffffff;
      z-index: 70;
      box-shadow: 10px 0 30px rgba(0,0,0,0.15);
      display: flex;
      flex-direction: column;
      transition: transform 0.28s ease;
    }

    .drawer.open { transform: translateX(320px); }

    .drawer-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      color: var(--primary);
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .drawer-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .lang-dropdown {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      background: #f8fafc;
      color: var(--text-main);
      outline: none;
      margin-bottom: 20px;
    }

    .btn-new-convo {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-bottom: 16px;
    }

    /* Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
    }
    .modal-overlay.open { display: block; }

    .modal-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 800px;
      max-height: 82vh;
      background: #ffffff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
      transition: transform 0.3s ease;
    }
    .modal-sheet.open { transform: translateX(-50%) translateY(0); }

    .modal-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .modal-title { font-size: 16px; font-weight: 800; color: var(--primary); }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .studio-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .studio-card:active { background: #eff6ff; border-color: #93c5fd; }
    .studio-icon { font-size: 24px; }
    .studio-name { font-size: 13.5px; font-weight: 700; color: var(--text-main); }
    .studio-desc { font-size: 11px; color: var(--text-muted); }

    /* Chat Area */
    .chat-view {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .welcome-card { padding: 24px 8px 8px; }
    .welcome-heading {
      font-size: 26px;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .welcome-text { font-size: 14px; color: var(--text-muted); line-height: 1.5; }

    .message-row { display: flex; width: 100%; }
    .message-row.user { justify-content: flex-end; }
    .message-row.ai { justify-content: flex-start; }

    .bubble {
      max-width: 86%;
      padding: 12px 16px;
      border-radius: 20px;
      font-size: 14.5px;
      line-height: 1.6;
      word-break: break-word;
    }
    .bubble.user { background: var(--bubble-user); color: var(--bubble-user-text); font-weight: 600; border-bottom-right-radius: 4px; }
    .bubble.ai { background: #f8fafc; border: 1px solid var(--border); color: var(--text-main); border-bottom-left-radius: 4px; width: 100%; max-width: 90%; }

    /* Thinking Animation */
    .thinking-dots {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 10px 14px;
      background: #f1f5f9;
      border-radius: 16px;
    }
    .dot {
      width: 7px;
      height: 7px;
      background: var(--primary);
      border-radius: 50%;
      animation: blinkDot 1.4s infinite ease-in-out both;
    }
    .dot:nth-child(1) { animation-delay: -0.32s; }
    .dot:nth-child(2) { animation-delay: -0.16s; }

    @keyframes blinkDot {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }

    /* Input Capsule */
