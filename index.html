<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>MasterMind AI - Next Gen Multiverse</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #ffffff;
      --card-bg: #f8fafc;
      --border: #e2e8f0;
      --primary: #1a73e8;
      --primary-gradient: linear-gradient(135deg, #1a73e8, #7c3aed);
      --text-main: #0f172a;
      --text-muted: #64748b;
      --bubble-user: #e0e7ff;
      --bubble-user-text: #1e1b4b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background-color: var(--bg);
      color: var(--text-main);
      overflow: hidden;
    }

    .app-container {
      display: flex;
      flex-direction: column;
      height: 100%;
      height: 100dvh;
      width: 100%;
      max-width: 800px;
      margin: 0 auto;
      position: relative;
      background: #ffffff;
      border-left: 1px solid var(--border);
      border-right: 1px solid var(--border);
    }

    /* Top Navigation */
    .header {
      height: 58px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
      background: #ffffff;
      z-index: 30;
      flex-shrink: 0;
    }

    .nav-left, .nav-right {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: transparent;
      border: none;
      width: 40px;
      height: 40px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #334155;
      cursor: pointer;
      transition: background 0.2s;
    }

    .btn-icon:active {
      background: #f1f5f9;
    }

    .app-title {
      font-size: 19px;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
      letter-spacing: -0.4px;
    }

    /* Multiverse Explorer Modal */
    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.4);
      backdrop-filter: blur(4px);
      z-index: 50;
      display: none;
    }

    .modal-overlay.open {
      display: block;
    }

    .modal-sheet {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 800px;
      max-height: 82vh;
      background: #ffffff;
      border-top-left-radius: 24px;
      border-top-right-radius: 24px;
      z-index: 60;
      display: flex;
      flex-direction: column;
      box-shadow: 0 -10px 40px rgba(0,0,0,0.15);
      transition: transform 0.3s cubic-bezier(0.2, 0, 0, 1);
    }

    .modal-sheet.open {
      transform: translateX(-50%) translateY(0);
    }

    .modal-header {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }

    .modal-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
    }

    .studio-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 6px;
      transition: all 0.2s;
    }

    .studio-card:active {
      background: #eff6ff;
      border-color: #93c5fd;
      transform: scale(0.98);
    }

    .studio-icon {
      font-size: 24px;
    }

    .studio-name {
      font-size: 13.5px;
      font-weight: 700;
      color: var(--text-main);
    }

    .studio-desc {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.35;
    }

    /* History & Setting Drawer */
    .drawer {
      position: fixed;
      top: 0;
      left: -320px;
      width: 300px;
      height: 100%;
      background: #ffffff;
      z-index: 70;
      box-shadow: 10px 0 30px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      transition: transform 0.28s cubic-bezier(0.2, 0, 0, 1);
    }

    .drawer.open {
      transform: translateX(320px);
    }

    .drawer-header {
      padding: 18px 20px;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-weight: 800;
      color: var(--primary);
    }

    .drawer-content {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
    }

    .drawer-label {
      font-size: 11px;
      font-weight: 800;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 8px;
    }

    .lang-dropdown {
      width: 100%;
      padding: 10px 12px;
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 600;
      background: #f8fafc;
      color: var(--text-main);
      outline: none;
      margin-bottom: 20px;
    }

    .btn-new-convo {
      width: 100%;
      padding: 12px;
      background: var(--primary);
      color: #ffffff;
      border: none;
      border-radius: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 16px;
    }

    /* Chat Stream Area */
    .chat-view {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      overflow-x: hidden;
      padding: 16px 16px 24px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      -webkit-overflow-scrolling: touch;
      scroll-behavior: smooth;
    }

    .welcome-card {
      padding: 24px 8px 8px;
      text-align: left;
    }

    .welcome-heading {
      font-size: 26px;
      font-weight: 800;
      background: var(--primary-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }

    .welcome-text {
      font-size: 14px;
      color: var(--text-muted);
      font-weight: 500;
