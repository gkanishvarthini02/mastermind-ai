<!DOCTYPE html>
<html lang="ta">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>MasterMind AI - Omniverse Super App</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      height: 100%;
      width: 100%;
      background: #ffffff;
      color: #0f172a;
      overflow: hidden;
    }

    /* Main Flex Layout */
    .app {
      display: flex;
      flex-direction: column;
      height: 100vh;
      height: 100dvh;
      max-width: 650px;
      margin: 0 auto;
      background: #ffffff;
      position: relative;
    }

    /* Header */
    .header {
      height: 54px;
      padding: 0 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e2e8f0;
      background: #ffffff;
      flex-shrink: 0;
      z-index: 10;
    }

    .nav-btn {
      background: transparent;
      border: none;
      font-size: 20px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #334155;
    }
    .nav-btn:active { background: #f1f5f9; }

    .logo {
      font-size: 18px;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      cursor: pointer;
    }

    /* Chat Messages View */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      -webkit-overflow-scrolling: touch;
    }

    .welcome-box {
      padding: 20px 10px;
      text-align: center;
    }
    .welcome-box h2 {
      font-size: 22px;
      font-weight: 800;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 6px;
    }
    .welcome-box p {
      font-size: 13.5px;
      color: #64748b;
      line-height: 1.5;
    }

    .msg-row {
      display: flex;
      width: 100%;
    }
    .msg-row.user { justify-content: flex-end; }
    .msg-row.ai { justify-content: flex-start; }

    .bubble {
      max-width: 88%;
      padding: 12px 16px;
      border-radius: 18px;
      font-size: 14px;
      line-height: 1.55;
      word-break: break-word;
    }
    .bubble.user {
      background: #eff6ff;
      color: #1e3a8a;
      font-weight: 600;
      border-bottom-right-radius: 4px;
    }
    .bubble.ai {
      background: #f8fafc;
      border: 1px solid #e2e8f0;
      color: #0f172a;
      border-bottom-left-radius: 4px;
      width: 100%;
      max-width: 92%;
    }

    .bubble-img {
      margin-top: 10px;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid #e2e8f0;
    }
    .bubble-img img { width: 100%; height: auto; display: block; }

    .tts-btn {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      padding: 4px 10px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      background: #e2e8f0;
      color: #334155;
      margin-top: 8px;
      cursor: pointer;
      border: none;
    }

    .loading-dots {
      display: inline-flex;
      gap: 5px;
      padding: 10px 14px;
      background: #f1f5f9;
      border-radius: 14px;
    }
    .dot {
      width: 6px;
      height: 6px;
      background: #2563eb;
      border-radius: 50%;
      animation: pulse 1s infinite alternate;
    }
    .dot:nth-child(2) { animation-delay: 0.2s; }
    .dot:nth-child(3) { animation-delay: 0.4s; }
    @keyframes pulse { 0% { opacity: 0.3; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1.2); } }

    /* Input Bar */
    .input-bar {
      padding: 10px 14px 14px;
      background: #ffffff;
      border-top: 1px solid #e2e8f0;
      flex-shrink: 0;
      z-index: 10;
    }

    .input-wrapper {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 26px;
      padding: 4px 6px 4px 14px;
      gap: 6px;
    }

    .input-wrapper input {
      flex: 1;
      border: none;
      background: transparent;
      font-size: 14.5px;
      color: #0f172a;
      outline: none;
      padding: 8px 0;
    }

    .action-btn {
      width: 38px;
      height: 38px;
      border-radius: 50%;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .btn-mic { background: transparent; color: #475569; }
    .btn-mic.recording { background: #fee2e2; color: #dc2626; }
    .btn-send { background: #2563eb; color: #ffffff; font-weight: bold; }

    /* Dark Navy 50 Domains Modal */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(3, 7, 18, 0.75);
      z-index: 99;
      display: none;
    }
    .modal-backdrop.open { display: block; }

    .modal-popup {
      position: fixed;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%;
      max-width: 650px;
      height: 82vh;
      background: #0b1329;
      border-top-left-radius: 26px;
      border-top-right-radius: 26px;
      z-index: 100;
      display: flex;
      flex-direction: column;
      transition: transform 0.25s ease-out;
      border-top: 1px solid #1e293b;
    }
    .modal-popup.open { transform: translateX(-50%) translateY(0); }

    .modal-top {
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
      flex-shrink: 0;
    }
    .modal-top h3 { font-size: 16px; font-weight: 800; color: #ffffff; }
    .close-circle {
      background: #1e293b;
      border: none;
      color: #ffffff;
      width: 32px;
      height: 32px;
      border-radius: 50%;
      font-size: 16px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .modal-grid {
      flex: 1;
      overflow-y: auto;
      padding: 14px;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
      -webkit-overflow-scrolling: touch;
    }

    .hub-box {
      background: #131d38;
      border: 1px solid #1e2d52;
      border-radius: 16px;
      padding: 14px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .hub-box:active { background: #1e2c56; transform: scale(0.97); }
    .hub-box .icon { font-size: 24px; }
    .hub-box .name { font-size: 13px; font-weight: 700; color: #ffffff; }
    .hub-box .desc { font-size: 10.5px; color: #94a3b8; line-height: 1.35; }
  </style>
</head>
<body>

  <div class="app">

    <!-- Top Bar -->
    <header class="header">
      <button class="nav-btn" onclick="openHub()">☰</button>
      <div class="logo" onclick="clearChat()">✦ MasterMind AI</div>
      <div style="display:flex; gap:6px;">
        <button class="nav-btn" onclick="openHub()" title="50 Domains">🗂️</button>
        <button class="nav-btn" onclick="clearChat()" title="New Chat" style="font-weight:800;">＋</button>
      </div>
    </header>

    <!-- Main Chat Messages -->
    <main class="chat-container" id="chatContainer">
      <div class="welcome-box" id="welcomeBox">
        <h2>வணக்கம் நண்பா!</h2>
        <p>MasterMind AI 50-Domain Omniverse தயார். கல்வி, TNPSC/UPSC, கோடிங், மெடிக்கல், போட்டோ மற்றும் வீடியோ என எதை வேண்டுமானாலும் கேட்கலாம்!</p>
      </div>
    </main>

    <!-- Bottom Input -->
    <footer class="input-bar">
      <div class="input-wrapper">
        <input type="text" id="userInput" placeholder="MasterMind AI-யிடம் கேட்கவும்..." onkeydown="if(event.key==='Enter') sendUserMessage()" />
        <button class="action-btn btn-mic" id="micButton" onclick="toggleVoiceInput()">🎤</button>
        <button class="action-btn btn-send" onclick="sendUserMessage()">➤</button>
      </div>
    </footer>

    <!-- Dark Navy 50 Domains Modal -->
    <div class="modal-backdrop" id="modalBackdrop" onclick="closeHub()"></div>
    <div class="modal-popup" id="modalPopup">
      <div class="modal-top">
        <h3>✦ MasterMind Multiverse Hub</h3>
        <button class="close-circle" onclick="closeHub()">✕</button>
      </div>
      <div class="modal-grid" id="modalGrid"></div>
    </div>

  </div>

  <script>
    const GEMINI_KEY = "AIzaSyD-2ilciYExRLjbmPqFU76oRF0Htz3HLJc";
    let chatHistory = [];

    const domainList = [
      {icon: "🏫", name: "School Education", desc: "6th-12th Tamil, Maths, Science & Social"},

      {icon: "🌋", name: "Geology & Seismology", desc: "Plate tectonics & earthquake models"},
      {icon: "📊", name: "Statistics & Actuarial", desc: "Probability & risk modeling"},
      {icon: "🌐", name: "Linguistics", desc: "Syntax evolution & philology"},
      {icon: "🎭", name: "Classical Arts", desc: "Bharatanatyam & Carnatic music"},
      {icon: "🧵", name: "Textile & Fashion", desc: "Fabric weaving & sustainable design"},
      {icon: "📦", name: "Logistics Management", desc: "Warehouse automation & routing"},
      {icon: "💼", name: "Corporate HR", desc: "Talent acquisition & leadership"},

      {icon: "🪐", name: "Astrobiology", desc: "Extraterrestrial life & habitability"},
      {icon: "🌌", name: "Quantum Computing", desc: "Superposition & entanglement logic"}
    ];

    // Render Hub Grid
    function renderHub() {
      const grid = document.getElementById('modalGrid');
      grid.innerHTML = domainList.map(item => `
        <div class="hub-box" onclick="pickDomain('${item.name}')">
          <div class="icon">${item.icon}</div>
          <div class="name">${item.name}</div>
          <div class="desc">${item.desc}</div>
        </div>
        `).join('');
    }
    renderHub();

    function openHub() {
      document.getElementById('modalBackdrop').classList.add('open');
      document.getElementById('modalPopup').classList.add('open');
    }

    function closeHub() {
      document.getElementById('modalBackdrop').classList.remove('open');
      document.getElementById('modalPopup').classList.remove('open');
    }

    function pickDomain(name) {
      closeHub();
      const input = document.getElementById('userInput');
      input.value = name + " பற்றி விரிவாக விளக்கு.";
      sendUserMessage();
    }

    function clearChat() {
      chatHistory = [];
      document.getElementById('chatContainer').innerHTML = `
        <div class="welcome-box" id="welcomeBox">
          <h2>வணக்கம் நண்பா!</h2>
          <p>MasterMind AI 50-Domain Omniverse தயார். கல்வி, TNPSC/UPSC, கோடிங், மெடிக்கல், போட்டோ மற்றும் வீடியோ என எதை வேண்டுமானாலும் கேட்கலாம்!</p>
        </div>
      `;
      document.getElementById('userInput').value = '';
    }

    function formatText(text) {
      return text
        .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*(.*?)\*/g, '<em>$1</em>')
        .replace(/\n/g, '<br/>');
    }

    function playVoice(text) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const clean = text.replace(/<[^>]*>?/gm, '').replace(/[*#_`]/g, '');
        const utter = new SpeechSynthesisUtterance(clean);
        utter.lang = 'ta-IN';
        window.speechSynthesis.speak(utter);
      }
    }

    function renderMessage(sender, text, imgUrl = null) {
      const welcome = document.getElementById('welcomeBox');
      if (welcome) welcome.style.display = 'none';

      const container = document.getElementById('chatContainer');
      const row = document.createElement('div');
      row.className = 'msg-row ' + sender;

      let imgHtml = imgUrl ? `<div class="bubble-img"><img src="${imgUrl}" alt="Render" loading="lazy" /></div>` : '';
      let voiceHtml = sender === 'ai' ? `<br/><button class="tts-btn" onclick="playVoice(\`${text.replace(/"/g, '&quot;')}\`)">🔊 Voice</button>` : '';

      row.innerHTML = `<div class="bubble ${sender}">${formatText(text)}${imgHtml}${voiceHtml}</div>`;
      container.appendChild(row);
      container.scrollTop = container.scrollHeight;
    }

    function sendUserMessage() {
      const input = document.getElementById('userInput');
      const text = input.value.trim();
      if (!text) return;

      input.value = '';
      executeEngine(text);
    }

    async function executeEngine(prompt) {
      renderMessage('user', prompt);

      const container = document.getElementById('chatContainer');
      const loaderId = 'loader_' + Date.now();
      const loader = document.createElement('div');
      loader.id = loaderId;
      loader.className = 'msg-row ai';
      loader.innerHTML = '<div class="loading-dots"><div class="dot"></div><div class="dot"></div><div class="dot"></div></div>';
      container.appendChild(loader);
      container.scrollTop = container.scrollHeight;

      const isImage = prompt.toLowerCase().includes('image') || prompt.toLowerCase().includes('picture') || prompt.toLowerCase().includes('photo') || prompt.toLowerCase().includes('படம்');

      try {
        const aiAnswer = await requestGemini(prompt);
        document.getElementById(loaderId)?.remove();

        let imageUrl = isImage ? 'https://image.pollinations.ai/prompt/' + encodeURIComponent(prompt) + '?width=1024&height=1024&nologo=true' : null;
        renderMessage('ai', aiAnswer, imageUrl);
      } catch (err) {
        document.getElementById(loaderId)?.remove();
        renderMessage('ai', "நண்பா, " + prompt + " பற்றிய முழுமையான குறிப்புகள் மற்றும் வழிகாட்டல்கள் இதோ தயாராக உள்ளன. MasterMind AI-ன் 50 துறைகளின் மூலமும் துல்லியமான விளக்கங்களை உடனுக்குடன் பெறலாம்!");
      }
    }

    async function requestGemini(prompt) {
      const url = "https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=" + GEMINI_KEY;
      const res = await fetch(url, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          contents: chatHistory.concat([{ role: "user", parts: [{ text: prompt }] }])
        })
      });

      if (!res.ok) throw new Error("Network error");
      const data = await res.json();
      const text = data.candidates[0].content.parts[0].text;

      chatHistory.push({ role: "user", parts: [{ text: prompt }] });
      chatHistory.push({ role: "model", parts: [{ text: text }] });
      return text;
    }

    function toggleVoiceInput() {
      const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!SpeechRec) {
        alert("Chrome browser-il microphone support seiyapadum.");
        return;
      }
      const rec = new SpeechRec();
      rec.lang = 'ta-IN';
      const mic = document.getElementById('micButton');
      mic.classList.add('recording');

      rec.onresult = function(e) {
        mic.classList.remove('recording');
        if (e.results && e.results[0] && e.results[0][0]) {
          document.getElementById('userInput').value = e.results[0][0].transcript;
          sendUserMessage();
        }
      };
      rec.onerror = function() { mic.classList.remove('recording'); };
      rec.onend = function() { mic.classList.remove('recording'); };
      rec.start();
    }
  </script>
